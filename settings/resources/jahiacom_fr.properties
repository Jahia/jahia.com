jahiacom_glossaryEntry.form.bodyHelp=Expliquez ce que signifie le terme, à quoi il sert et comment il fonctionne. Utilisez des phrases courtes, compréhensibles sans connaissances techniques. Ne recopiez pas le titre dans ce texte.
jahiacom_glossaryEntry.form.comparisonHelp=Nommez les termes que le lecteur pourrait confondre avec celui-ci et expliquez leurs différences. Pour un tableau, utilisez une colonne Terme et une colonne Différence, avec une ligne par terme comparé.
jahiacom_glossaryEntry.form.resourcesHelp=Sélectionnez des contenus publiés qui expliquent ou illustrent ce terme : articles, pages de solution, cas clients ou infographies. Placez les plus utiles en premier. Les six premiers sont visibles directement ; les suivants apparaissent en ouvrant la liste complète. Le nombre affiché est calculé automatiquement.
jahiacom_glossaryEntry.form.relatedTermsHelp=Sélectionnez des fiches du glossaire qui aident à comprendre ce sujet, par exemple Intranet et Extranet pour Web portal. Leurs noms et définitions courtes apparaissent dans le bloc Termes associés. Laissez vide si aucun terme ne convient.
jahiacom_glossaryEntry.form.comparisonTitleHelp=Facultatif. Donnez un titre aux différences expliquées juste en dessous, par exemple Portail web, site web et intranet. Si vous laissez ce champ vide, un titre est ajouté automatiquement.
jahiacom_glossaryEntry.form.ce_systemNameHelp=Ce nom fait partie de l’adresse de la fiche : web-portal donne web-portal.html. Gardez le nom proposé à partir du titre. Si la fiche est déjà publiée, évitez de le changer pour conserver son adresse.
jahiacommix_glossaryFolder=Configuration du glossaire
jahiacommix_glossaryFolder.glossaryIndexPage=Page du glossaire
jahiacommix_glossaryFolder.glossaryIndexPage.ui.tooltip=Page utilisée automatiquement pour le retour et le fil d’Ariane de toutes les fiches de ce dossier.

jahiacom_glossary.form.intro=Fiches affichées
jahiacom_glossary.form.search=Recherche dans le glossaire
jahiacom_glossary.form.searchHelp=Les textes sont personnalisables. La recherche filtre automatiquement les termes, définitions courtes et synonymes. Laisser vide pour utiliser le texte par défaut.
jahiacom_glossary.searchLabel=Libellé du champ de recherche
jahiacom_glossary.searchPlaceholder=Exemples affichés dans le champ
jahiacom_glossary.searchHelp=Texte d’aide sous la recherche
jahiacom_glossaryEntry.definitionTitle=Titre de la définition
jahiacom_glossaryEntry.example=Informations pratiques et sources
jahiacom_glossaryEntry.faq=Questions et réponses
jahiacom_glossaryEntry.form.exampleHelp=Ajoutez des conseils utiles, des points à vérifier ou des chiffres qui éclairent ce terme. Pour chaque chiffre, indiquez la source avec son lien, l’année et le pays ou le public concerné. Laissez le texte vide si vous n’avez rien à ajouter : ce bloc ne sera pas affiché.
jahiacom_glossaryEntry.form.faqHelp=Écrivez une question que le lecteur pourrait se poser, puis sa réponse juste en dessous. Répétez pour chaque question. Dans la barre de mise en forme, choisissez Titre 3 pour les questions et Paragraphe pour les réponses. Laissez vide pour ne pas afficher ce bloc.

jahiacom_glossaryEntry.exampleTitle=Titre des informations pratiques
jahiacom_glossaryEntry.form.definitionTitleHelp=Facultatif. Écrivez seulement le titre à afficher au-dessus de la définition, par exemple Comment fonctionne un portail web ? Si vous laissez ce champ vide, un titre est ajouté automatiquement.
jahiacom_glossaryEntry.form.exampleTitleHelp=Donnez un titre au texte ci-dessous, par exemple Les points à vérifier ou Comment mesurer les résultats. Ce titre apparaît au-dessus de ces informations sur la fiche. Si vous le laissez vide, le titre Exemple concret sera utilisé.
jahiacom_glossaryEntry.form.termHelp=Indiquez le nom du terme et une courte définition. Ces informations apparaissent dans la liste du glossaire et en haut de la fiche.
jahiacom_glossaryEntry.form.explanationHelp=Rédigez la fiche dans l’ordre de lecture : définition, différences avec les termes proches, informations pratiques, puis questions et réponses. Chaque champ de titre se trouve juste au-dessus du texte qu’il présente.
jahiacom_glossaryEntry.form.furtherHelp=Choisissez des contenus déjà présents sur le site. Les ressources renvoient vers des articles ou des pages Jahia ; les termes associés renvoient vers d’autres fiches du glossaire. Les liens sont créés automatiquement.

jahiacom_card.glossaryMetric=Valeur automatique du glossaire
jahiacom_card.glossaryMetric.none=Aucune (carte classique)
jahiacom_card.glossaryMetric.entries=Nombre de fiches
jahiacom_card.glossaryMetric.letters=Nombre de lettres
jahiacom_card.glossaryMetric.updated=Dernière mise à jour des fiches
jahiacom_card.glossaryMetric.ui.tooltip=Choisissez la valeur à calculer. Le titre de la carte sert de libellé ; le texte reste facultatif. Gardez Aucune pour une carte classique.
jahiacom_card.glossaryFolder=Dossier des fiches du glossaire
jahiacom_card.glossaryFolder.ui.tooltip=Sélectionnez le même dossier que celui du glossaire. La valeur suit automatiquement les fiches visibles.
jahiacom_glossary.form.listingHelp=Le header et les indicateurs se modifient dans leurs propres blocs Hero et Section de la page. Ce bloc gère la liste et la recherche.
