jahiacom_glossary.updatedLabel.ui.tooltip=Calculée automatiquement à partir de la dernière création ou modification des fiches affichées. L’ancienne valeur manuelle n’est plus utilisée.
jahiacom_glossaryEntry=Entrée du glossaire
jahiacom_glossaryEntry.jcr_title=Nom du terme
jahiacom_glossaryEntry.summary=Définition courte
jahiacom_glossaryEntry.aliases=Autres noms et abréviations
jahiacom_glossaryEntry.aliases.ui.tooltip=Facultatif. Ajoutez un autre nom ou une abréviation par ligne, par exemple CMS pour Content management system. Ils sont affichés sur la fiche et permettent de retrouver le terme dans la recherche.
jahiacom_glossaryEntry.body=Texte de la définition
jahiacom_glossaryEntry.summary.ui.tooltip=Expliquez le terme en une ou deux phrases simples. Ce texte apparaît sous son nom dans le glossaire et en introduction de la fiche. Les explications détaillées vont dans le champ Texte de la définition.
jahiacom_glossaryEntry.body.ui.tooltip=Expliquez ce que signifie le terme, à quoi il sert et comment il fonctionne. Utilisez des phrases courtes, compréhensibles sans connaissances techniques. Ne recopiez pas le titre dans ce texte.
jahiacom_glossaryEntry.comparisonTitle=Titre de la comparaison
jahiacom_glossaryEntry.comparisonTitle.ui.tooltip=Facultatif. Donnez un titre aux différences expliquées juste en dessous, par exemple Portail web, site web et intranet. Si vous laissez ce champ vide, un titre est ajouté automatiquement.
jahiacom_glossaryEntry.comparison=Différences avec les termes proches
jahiacom_glossaryEntry.comparison.ui.tooltip=Nommez les termes que le lecteur pourrait confondre avec celui-ci et expliquez leurs différences. Pour un tableau, utilisez une colonne Terme et une colonne Différence, avec une ligne par terme comparé.
jahiacom_glossaryEntry.resources=Pages et articles pour aller plus loin
jahiacom_glossaryEntry.resources.ui.tooltip=Sélectionnez des contenus publiés qui expliquent ou illustrent ce terme : articles, pages de solution, cas clients ou infographies. Placez les plus utiles en premier. Les six premiers sont visibles directement ; les suivants apparaissent en ouvrant la liste complète. Le nombre affiché est calculé automatiquement.
jahiacom_glossaryEntry.relatedTerms=Autres termes du glossaire à consulter
jahiacom_glossaryEntry.relatedTerms.ui.tooltip=Sélectionnez des fiches du glossaire qui aident à comprendre ce sujet, par exemple Intranet et Extranet pour Web portal. Leurs noms et définitions courtes apparaissent dans le bloc Termes associés. Laissez vide si aucun terme ne convient.

jahiacom_glossary.entriesFolder=Dossier des fiches du glossaire
jahiacom_glossary.entriesFolder.ui.tooltip=Sélectionnez le dossier des fiches. Leurs titres et définitions courtes alimentent automatiquement l’index.
jahiacom_glossaryEntry.indexPage=Page index du glossaire
jahiacom_glossaryEntry.indexPage.ui.tooltip=Page utilisée pour le lien de retour et le fil d’Ariane.

jahiacom_glossaryEntry.form.term=1. Présenter le terme
jahiacom_glossaryEntry.form.explanation=2. Expliquer le terme
jahiacom_glossaryEntry.form.further=3. Proposer des liens utiles
jahiacom_glossaryEntry.form.jcr_titleHelp = Nom affiché dans le glossaire et en titre de la fiche.
jahiacom_glossaryEntry.form.summaryHelp = Une ou deux phrases affichées dans la liste du glossaire. Le début de la fiche utilise le premier paragraphe du texte de définition.
jahiacom_glossaryEntry.form.aliasesHelp = Facultatif. Un autre nom ou une abréviation par valeur. Ils servent aussi à la recherche.
jahiacom_glossaryEntry.form.bodyHelp = Commencez par un paragraphe qui définit le terme : il apparaît directement sous le titre de la fiche. Les paragraphes suivants apparaissent sous le titre de développement.
jahiacom_glossaryEntry.form.comparisonHelp = Expliquez les différences avec les concepts proches. Pour un tableau : une ligne par concept.
jahiacom_glossaryEntry.form.comparisonTitleHelp = Facultatif. Titre du texte de comparaison ci-dessous. Laissez vide pour un titre automatique.
jahiacom_glossaryEntry.form.ce_systemNameHelp = Adresse de la fiche. Gardez le nom proposé ; ne le changez plus après publication.
jahiacommix_glossaryFolder=Configuration du glossaire
jahiacommix_glossaryFolder.glossaryIndexPage=Page du glossaire
jahiacommix_glossaryFolder.glossaryIndexPage.ui.tooltip=Page utilisée automatiquement pour le retour et le fil d’Ariane de toutes les fiches de ce dossier.

jahiacom_glossary.form.intro=Fiches affichées
jahiacom_glossary.form.search=Recherche dans le glossaire
jahiacom_glossary.form.searchHelp=Les textes sont personnalisables. La recherche filtre automatiquement les termes, définitions courtes et synonymes. Laisser vide pour utiliser le texte par défaut.
jahiacom_glossary.searchLabel=Libellé du champ de recherche
jahiacom_glossary.searchPlaceholder=Exemples affichés dans le champ
jahiacom_glossary.searchHelp=Texte d’aide sous la recherche
jahiacom_glossaryEntry.definitionTitle = Titre du développement
jahiacom_glossaryEntry.example=Informations pratiques et sources
jahiacom_glossaryEntry.faq=Questions et réponses
jahiacom_glossaryEntry.form.exampleHelp = Conseils, exemples ou chiffres sourcés. Pour un chiffre, indiquez la source, son lien, la date et le périmètre. Vide : bloc masqué.
jahiacom_glossaryEntry.form.faqHelp = Une question en Titre 3, puis sa réponse en Paragraphe. Répétez au besoin. Vide : bloc masqué.

jahiacom_glossaryEntry.exampleTitle=Titre des informations pratiques
jahiacom_glossaryEntry.form.definitionTitleHelp = Titre du développement, affiché après le premier paragraphe de définition. Laissez vide pour utiliser le titre automatique.
jahiacom_glossaryEntry.form.exampleTitleHelp = Facultatif. Titre du bloc ci-dessous. Il apparaît uniquement si ce bloc contient du texte.
jahiacom_glossaryEntry.form.termHelp = Présentez le terme. La date de mise à jour et le retour au glossaire sont gérés automatiquement.
jahiacom_glossaryEntry.form.explanationHelp = Rédigez dans l’ordre de la page. Chaque titre se trouve au-dessus de son texte.
jahiacom_glossaryEntry.form.furtherHelp = La sélection alimente les ressources et le bloc « Pour aller plus loin ». Les liens entre mots du texte se règlent séparément ci-dessous.

jahiacom_card.glossaryMetric=Valeur automatique du glossaire
jahiacom_card.glossaryMetric.none=Aucune (carte classique)
jahiacom_card.glossaryMetric.entries=Nombre de fiches
jahiacom_card.glossaryMetric.letters=Nombre de lettres
jahiacom_card.glossaryMetric.updated=Dernière mise à jour des fiches
jahiacom_card.glossaryMetric.ui.tooltip=Choisissez la valeur à calculer. Le titre de la carte sert de libellé ; le texte reste facultatif. Gardez Aucune pour une carte classique.
jahiacom_card.glossaryFolder=Dossier des fiches du glossaire
jahiacom_card.glossaryFolder.ui.tooltip=Sélectionnez le même dossier que celui du glossaire. La valeur suit automatiquement les fiches visibles.
jahiacom_glossary.form.listingHelp=Le header et les indicateurs se modifient dans leurs propres blocs Hero et Section de la page. Ce bloc gère la liste et la recherche.

jahiacom_glossaryEntry.autoLinks = Sélection automatique
jahiacom_glossaryEntry.linkKeywords = Expressions de recherche complémentaires
jahiacom_glossaryEntry.linkThemes = Thématiques (facultatif)
jahiacom_glossaryEntry.excludedLinks = Exclure des suggestions automatiques
jahiacom_glossaryEntry.form.autoLinksHelp = Activé : calcule les ressources et les termes associés à partir de la fiche. Désactivé : masque ces suggestions. Les liens dans le texte sont gérés par l’option suivante.
jahiacom_glossaryEntry.form.linkThemesHelp = Facultatif. Limite les ressources aux thématiques choisies. Vide : tout le site. Les termes associés ne sont pas filtrés par thématique.

jahiacom_glossary.form.alphabet=Index alphabétique
jahiacom_glossary.showUnusedLetters=Afficher les lettres inutilisées
jahiacom_glossary.showUnusedLetters.ui.tooltip=Activé : affiche tout l’alphabet. Les lettres sans résultat restent non cliquables, y compris pendant une recherche. Désactivé : affiche uniquement les lettres avec des résultats. Ce réglage est commun à toutes les langues.

jahiacom_glossaryEntry.indexLabel = Nom dans l’index
jahiacom_glossaryEntry.editorialAuthor = Auteur
jahiacom_glossaryEntry.editorialDate = Date éditoriale
jahiacom_glossaryEntry.autoTermLinks = Relier automatiquement les termes cités
jahiacom_glossaryEntry.form.editorial = 4. Auteur et date
jahiacom_glossaryEntry.form.editorialHelp = Ces informations apparaissent en bas de la fiche. La date éditoriale reste celle que vous choisissez.
jahiacom_glossaryEntry.form.indexLabelHelp = Facultatif. Nom court utilisé dans la liste du glossaire et pour le classement alphabétique. Sans valeur, le titre est utilisé.
jahiacom_glossaryEntry.form.editorialAuthorHelp = Nom de la personne ou de l’équipe responsable de cette fiche. Laissez vide pour ne pas afficher d’auteur.
jahiacom_glossaryEntry.form.editorialDateHelp = Date de rédaction ou de révision du contenu. Elle ne change pas lors d’une simple modification technique.
jahiacom_glossaryEntry.form.autoTermLinksHelp = Ajoute au maximum 6 liens sur les expressions complètes de plusieurs mots, une seule fois par fiche cible. Aucun lien dans le paragraphe sous le titre, les titres ou les en-têtes de colonnes. Les mots isolés et la fiche elle-même sont exclus.

jahiacom_glossaryEntry.conceptTerms = Expressions du sujet
jahiacom_glossaryEntry.form.conceptTermsHelp = Facultatif. Une expression par valeur, en français ou en anglais. Exemples : événement, events. Une de ces expressions doit être présente. Les trois listes sont communes aux deux langues. Si cette liste est vide, la sélection habituelle est conservée.
jahiacom_glossaryEntry.conceptScope = Contexte nécessaire
jahiacom_glossaryEntry.form.conceptScopeHelp = Facultatif. Exemples : jExperience, Unomi. Une de ces expressions doit apparaître près de celle du sujet. Laissez vide si le sujet est assez précis.
jahiacom_glossaryEntry.conceptSignals = Indices complémentaires
jahiacom_glossaryEntry.form.conceptSignalsHelp = Facultatif. Exemples : collecte, collected, interactions. Si cette liste est remplie, une expression est également exigée dans le même passage. Elle sert à écarter les faux rapprochements.
jahiacom_glossaryEntry.preferEducational = Privilégier les ressources pédagogiques
jahiacom_glossaryEntry.form.preferEducationalHelp = Favorise les guides, explications et tutoriels parmi les ressources pertinentes. Une ressource sans rapport avec le terme ne sera jamais ajoutée pour cette seule raison.

jahiacom_glossaryEntry.resourceDisplayCount = Nombre de ressources visibles
jahiacom_glossaryEntry.form.resourceDisplayCountHelp = Choisissez 3, 6 ou 9 ressources affichées au départ. Les autres restent accessibles avec « Voir les ressources ». Si moins de ressources sont disponibles, seules celles-ci apparaissent. Réglage commun au français et à l’anglais.

jahiacom_glossaryEntry.resourceCtaLabel = Texte du bouton de ressource
jahiacom_glossaryEntry.form.resourceCtaLabelHelp = Facultatif. Vide : « Consulter la ressource ». Le lien reste choisi automatiquement.

jahiacom_glossaryEntry.resourceCtaVariant = Style du bouton de ressource
jahiacom_glossaryEntry.form.resourceCtaVariantHelp = Apparence du bouton sous la ressource dans « Pour aller plus loin ». Vide : Primary (plein).
jahiacom_glossaryEntry.resourceCtaVariant.primary = Primary (plein)
jahiacom_glossaryEntry.resourceCtaVariant.secondary = Secondary (contour)

jahiacom_glossaryEntry.relatedCtaVariant = Style des boutons des termes associés
jahiacom_glossaryEntry.form.relatedCtaVariantHelp = Un même style pour tous les boutons de termes dans « Pour aller plus loin ». Vide : Secondary (contour).
jahiacom_glossaryEntry.relatedCtaVariant.primary = Primary (plein)
jahiacom_glossaryEntry.relatedCtaVariant.secondary = Secondary (contour)
