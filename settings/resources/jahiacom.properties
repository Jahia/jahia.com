jahiacom_glossaryEntry.summary.ui.tooltip=Explain the term in one or two simple sentences. This appears under its name in the glossary and introduces the entry. Put detailed explanations in Definition text.
jahiacom_glossaryEntry.body.ui.tooltip=Explain what the term means, what it is used for and how it works. Use short sentences that do not require technical knowledge. Do not repeat the title in this text.
jahiacom_glossaryEntry.comparisonTitle=Comparison title
jahiacom_glossaryEntry.comparisonTitle.ui.tooltip=Optional. Name the comparison described below, for example Web portal, website and intranet. Leave empty to use an automatic title.
jahiacom_glossaryEntry.comparison=Differences from similar terms
jahiacom_glossaryEntry.comparison.ui.tooltip=Name the terms readers might confuse with this one and explain their differences. For a table, use a Term column and a Difference column, with one row per term compared.
jahiacom_glossaryEntry.resources=Pages and articles for further reading
jahiacom_glossaryEntry.resources.ui.tooltip=Select published content explaining or illustrating the term: articles, solution pages, customer stories or infographics. Put the most useful first. The first six are immediately visible; the rest appear when readers expand the full list. The displayed count is calculated automatically.
jahiacom_glossaryEntry.relatedTerms=Other glossary terms to explore
jahiacom_glossaryEntry.relatedTerms.ui.tooltip=Select glossary entries that help explain this subject, for example Intranet and Extranet for Web portal. Their names and short definitions appear in Related entries. Leave empty if none are relevant.

jahiacom_glossary.entriesFolder=Glossary content folder
jahiacom_glossary.entriesFolder.ui.tooltip=Select the folder containing the glossary entries. Their titles and summaries populate the index automatically.
jahiacom_glossaryEntry.indexPage=Glossary index page
jahiacom_glossaryEntry.indexPage.ui.tooltip=Select the page used for the return link and breadcrumb.

jahiacom_glossaryEntry.form.term=1. Introduce the term
jahiacom_glossaryEntry.form.explanation=2. Explain the term
jahiacom_glossaryEntry.form.further=3. Add useful links
jahiacom_glossaryEntry.form.jcr_titleHelp = Name shown in the glossary and as the entry title.
jahiacom_glossaryEntry.form.summaryHelp = One or two sentences displayed in the glossary index. The entry introduction uses the first paragraph of the definition text.
jahiacom_glossaryEntry.form.aliasesHelp = Optional. One alternative name or abbreviation per value. Also used for search.
jahiacom_glossaryEntry.form.bodyHelp = Start with a paragraph defining the term: it appears directly below the entry title. The following paragraphs appear under the development heading.
jahiacom_glossaryEntry.form.comparisonHelp = Explain differences from related concepts. For a table, use one row per concept.
jahiacom_glossaryEntry.form.comparisonTitleHelp = Optional. Heading for the comparison below. Leave empty for an automatic heading.
jahiacom_glossaryEntry.form.ce_systemNameHelp = Entry URL name. Keep the suggested value; do not change it after publication.
jahiacommix_glossaryFolder=Glossary configuration
jahiacommix_glossaryFolder.glossaryIndexPage=Glossary index page
jahiacommix_glossaryFolder.glossaryIndexPage.ui.tooltip=Automatically used for the return link and breadcrumb of every entry in this folder.

jahiacom_glossary.form.intro=Displayed entries
jahiacom_glossary.form.search=Glossary search
jahiacom_glossary.form.searchHelp=Customize the wording. Search automatically filters terms, short definitions and aliases. Leave empty to use the default wording.
jahiacom_glossary.searchLabel=Search field label
jahiacom_glossary.searchPlaceholder=Search placeholder examples
jahiacom_glossary.searchHelp=Help text below search
jahiacom_glossaryEntry.definitionTitle = Development heading
jahiacom_glossaryEntry.example=Practical information and sources
jahiacom_glossaryEntry.faq=Questions and answers
jahiacom_glossaryEntry.form.exampleHelp = Advice, examples or sourced figures. For figures, include the source, link, date and scope. Empty: block hidden.
jahiacom_glossaryEntry.form.faqHelp = A question in Heading 3, followed by its answer in Paragraph. Repeat as needed. Empty: block hidden.

jahiacom_glossaryEntry.exampleTitle=Practical information title
jahiacom_glossaryEntry.form.definitionTitleHelp = Development heading, displayed after the first definition paragraph. Leave empty to use the automatic heading.
jahiacom_glossaryEntry.form.exampleTitleHelp = Optional. Heading for the block below. Only displayed when that block contains text.
jahiacom_glossaryEntry.form.termHelp = Introduce the term. The last-updated date and glossary return link are automatic.
jahiacom_glossaryEntry.form.explanationHelp = Write in page order. Each heading field sits above its text.
jahiacom_glossaryEntry.form.furtherHelp = The selection fills the resources and the Explore related concepts block. Links within the text are controlled separately below.

jahiacom_card.glossaryMetric=Automatic glossary value
jahiacom_card.glossaryMetric.none=None (regular card)
jahiacom_card.glossaryMetric.entries=Number of entries
jahiacom_card.glossaryMetric.letters=Number of letters
jahiacom_card.glossaryMetric.updated=Last content update
jahiacom_card.glossaryMetric.ui.tooltip=Choose a calculated value. The card title becomes its label; the body remains optional. Leave None for a regular card.
jahiacom_card.glossaryFolder=Glossary entries folder
jahiacom_card.glossaryFolder.ui.tooltip=Choose the same entries folder as the glossary. The value updates when visible entries change.
jahiacom_glossary.form.listingHelp=Edit the header and metrics in their own Hero and Section blocks on the page. This block manages the list and search.

jahiacom_glossaryEntry.autoLinks = Automatic selection
jahiacom_glossaryEntry.linkKeywords = Additional search expressions
jahiacom_glossaryEntry.linkThemes = Themes (optional)
jahiacom_glossaryEntry.excludedLinks = Exclude from automatic suggestions
jahiacom_glossaryEntry.form.autoLinksHelp = Enabled: calculates resources and related terms from this entry. Disabled: hides these suggestions. In-text links are controlled by the following option.
jahiacom_glossaryEntry.form.linkThemesHelp = Optional. Restricts resources to the selected themes. Empty: the whole site. Related terms are not filtered by theme.

jahiacom_glossary.form.alphabet=Alphabetical index
jahiacom_glossary.showUnusedLetters=Show unused letters
jahiacom_glossary.showUnusedLetters.ui.tooltip=Enabled: show the full alphabet. Letters without matching terms are disabled, including during a search. Disabled: show only letters with results. This setting applies to all languages.

jahiacom_glossaryEntry.indexLabel = Index label
jahiacom_glossaryEntry.editorialAuthor = Author
jahiacom_glossaryEntry.editorialDate = Editorial date
jahiacom_glossaryEntry.autoTermLinks = Automatically link mentioned terms
jahiacom_glossaryEntry.form.editorial = 4. Author and date
jahiacom_glossaryEntry.form.editorialHelp = These details appear at the bottom of the entry. The editorial date stays as you set it.
jahiacom_glossaryEntry.form.indexLabelHelp = Optional short name for the glossary list and alphabetical sorting. Leave empty to use the title.
jahiacom_glossaryEntry.form.editorialAuthorHelp = Person or team responsible for this entry. Leave empty to hide the author.
jahiacom_glossaryEntry.form.editorialDateHelp = Date the content was written or revised. Technical changes do not update this date.
jahiacom_glossaryEntry.form.autoTermLinksHelp = Adds up to 6 links on complete multi-word expressions, once per target entry. No links in the paragraph below the title, headings or column headers. Single words and the current entry are excluded.

jahiacom_glossaryEntry.conceptTerms = Subject expressions
jahiacom_glossaryEntry.form.conceptTermsHelp = Optional. One expression per value, in French or English. Examples: événement, events. At least one must occur. All three lists are shared between languages. Leave this list empty to keep the usual selection.
jahiacom_glossaryEntry.conceptScope = Required context
jahiacom_glossaryEntry.form.conceptScopeHelp = Optional. Examples: jExperience, Unomi. At least one must occur near the subject expression. Leave empty when the subject is specific enough.
jahiacom_glossaryEntry.conceptSignals = Additional evidence
jahiacom_glossaryEntry.form.conceptSignalsHelp = Optional. Examples: collecte, collected, interactions. When filled, at least one expression is also required in the same passage. Use this to reject misleading matches.
jahiacom_glossaryEntry.preferEducational = Prioritize educational resources
jahiacom_glossaryEntry.form.preferEducationalHelp = Favors guides, explanations and tutorials among relevant resources. This preference never adds an unrelated resource.

jahiacom_glossaryEntry.resourceDisplayCount = Number of visible resources
jahiacom_glossaryEntry.form.resourceDisplayCountHelp = Choose 3, 6 or 9 resources to show initially. Additional resources remain accessible through the show-all control. If fewer resources are available, only those are shown. This setting is shared between French and English.

jahiacom_glossaryEntry.resourceCtaLabel = Resource button text
jahiacom_glossaryEntry.form.resourceCtaLabelHelp = Optional. Leave empty for “View resource”. The link is still selected automatically.

jahiacom_glossaryEntry.resourceCtaVariant = Resource button style
jahiacom_glossaryEntry.form.resourceCtaVariantHelp = Appearance of the resource button in “Explore further”. Empty: Primary (filled).
jahiacom_glossaryEntry.resourceCtaVariant.primary = Primary (filled)
jahiacom_glossaryEntry.resourceCtaVariant.secondary = Secondary (outline)

jahiacom_glossaryEntry.relatedCtaVariant = Related term button style
jahiacom_glossaryEntry.form.relatedCtaVariantHelp = One style for all related term buttons in “Explore further”. Empty: Secondary (outline).
jahiacom_glossaryEntry.relatedCtaVariant.primary = Primary (filled)
jahiacom_glossaryEntry.relatedCtaVariant.secondary = Secondary (outline)
