name: Build and Push

on: push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: yarn install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: publication-integrity/pom.xml
      - run: mvn -B -f publication-integrity/pom.xml -Drevision=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version') verify
      - name: Run shared regression and security tests
        run: yarn node --test scripts/test-*.mjs
      - run: yarn lint
      - run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          path: dist/package.tgz
          archive: false

  build-card-carousel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/jahia-card-carousel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: modules/jahia-card-carousel/.node-version
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prettier --check .
      - run: yarn test
      - run: yarn lint
      - run: yarn build
      - run: cp dist/package.tgz dist/jahia-card-carousel.tgz
      - uses: actions/upload-artifact@v7
        with:
          path: modules/jahia-card-carousel/dist/jahia-card-carousel.tgz
          archive: false
