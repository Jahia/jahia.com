name: Build and Push

on: push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: yarn install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: publication-integrity/pom.xml
      - run: mvn -B -f publication-integrity/pom.xml -Drevision=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version') verify
      - name: Run shared regression and security tests
        run: yarn node --test scripts/test-*.mjs
      - run: yarn lint
      - run: yarn build
      - uses: actions/upload-artifact@v7
        with:
          path: dist/package.tgz
          archive: false
