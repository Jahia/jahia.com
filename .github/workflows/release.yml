name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch: null
jobs:
  prepare-next-release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - run: npx chachalog@^0.5.0 prepare-next-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: publication-integrity/pom.xml
      - run: mvn -B -f publication-integrity/pom.xml -Drevision=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version') verify
      - run: yarn install && yarn build
      - id: chachalog
        run: npx chachalog@^0.5.0 publish-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          path: dist/package.tgz
          archive: false
      - name: Attach artifacts to the newly created release
        if: steps.chachalog.outputs.released_jahiacom == 'true'
        run: node scripts/attach-release-artifacts.mjs
        env:
          RELEASE_CREATED: ${{ steps.chachalog.outputs.released_jahiacom }}
          BUILT_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
